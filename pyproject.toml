[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polyphon"
version = "0.1.0"
description = "Pluggable text-to-speech pipeline for audiobook generation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13",
]

[project.optional-dependencies]
google     = ["google-cloud-texttospeech>=2.16"]
elevenlabs = []                                        # uses httpx (already in core)
azure      = ["azure-cognitiveservices-speech>=1.38"]
kokoro     = ["kokoro>=0.9.4", "torch", "soundfile", "numpy"]
all        = [
    "google-cloud-texttospeech>=2.16",
    "azure-cognitiveservices-speech>=1.38",
]

[project.scripts]
polyphon = "polyphon.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "S",        # bandit (security)
    "BLE",      # blind exception
    "ANN",      # annotations
]
ignore = ["ANN101", "ANN102", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["polyphon"]
omit = ["tests/*", "examples/*"]

[tool.uv]
default-groups = ["dev"]
